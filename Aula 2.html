<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de listas</Title>

</head>
<body>
    <h1> Elementos de listas</h1>
    <p>
        As Listas HTML são utilizadas para organizar informações 
        em uma sequência.
    </p>
    <h2>Listas Ordenadas </h2>
    <OL>
        <li>Primeiro item </li>
        <li>Segundo item </li>
        <li>Terceiro item </li>
     </OL>
     <h2>Lista não Ordenadas</h2>
     <ul>
     <Li>Item 1 </Li>
     <Li>Item 2 </Li>
      <Li>Item 3 </Li>
     </ul>
</body>
</html>
