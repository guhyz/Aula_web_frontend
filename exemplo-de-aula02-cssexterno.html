<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classes e css interno</title>
    <style>
     .titulo {
        color: black;
        text-align: center;
     }
     .caixa01 {
        background-color: aliceblue;
        border: 3px solid black;
        padding: 20px;
        margin: 20px;
     }
     .caixa02 {
        background-color: rgb(0, 57, 107);
        border: 3px solid rgb(93, 0, 136);
        padding: 20px;
        margin: 20px;
     }
     .destaque01{
        color: rgb(0, 0, 0);
        font-weight: bold;
     }
     .destaque02 {
        color: rgb(0, 0, 0);
        background-color: darkgray;
        font-style: italic;
        padding: 10px;
     }
    </style>
</head>
    <body>
        <h1 class="titulo">Aprendendo classes em css</h1>
        <div class="caixa01">
            <p>
                Estou aprendendo a utilizar classes para personalizar 
                os elementos de uma página.
            </p>
            <p class="destaque01">
                Este paragrafo utiliza a classe destaque01
            </p>
            <p class="destaque02">
                Este paragrafo utiliza a classe destaque02
            </p>
    </div>
    <div class"caixa02">
        <p>Este paragrafo nao utiliza nenhuma classe</p>

    </div>
</body>
</html>
