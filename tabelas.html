<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de tabelas</title>
</head>
       <body>
       <h1>
        Tabelas em html</h1>
        <p>
            As tabelas em html são usadas para  <br>
             organizar dados em linhas e colunas
        </p>

        <table border="1"

          ><thead>
             <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Cidade</th>
            </tr>
          </thead>
          <tbody>
            <tr>
                <td>Gustavo</td>
                <td>19</td>
                <td>Guarulhos</td>
            
            </tr>  
            <tr>
                <td>Manoella</td>
                <td>17</td>
                <td>Guarulhos</td>
            
            </tr> 
          </tbody>

        </table>
</body>
</html>
